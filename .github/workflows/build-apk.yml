name: Сборка APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Тесты расчётного ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Прогон тестов
        run: python tests/test_optics.py

  build:
    name: Сборка APK
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # В Ubuntu 24.04 (noble) пакетов libtinfo5, libncurses5-dev
      # и libncursesw5-dev больше нет — используем актуальные имена.
      # libltdl-dev обязателен: он даёт /usr/share/aclocal/ltdl.m4, где
      # определён макрос LT_SYS_SYMBOL_USCORE. Без него autogen.sh рецепта
      # libffi падает с «possibly undefined macro». Пакет числится в
      # Recommends для libtool, поэтому --no-install-recommends его отсекает
      # и ставить его нужно явно.
      - name: Системные пакеты
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin libltdl-dev \
            pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache patchelf
          test -f /usr/share/aclocal/ltdl.m4 \
            && echo "ltdl.m4 на месте — libffi соберётся" \
            || { echo "ltdl.m4 отсутствует"; exit 1; }

      - name: Buildozer и Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36

      # Кэш экономит 20–40 минут на повторных сборках.
      # Восстанавливаем всегда, а сохраняем только после успешной сборки:
      # обычный actions/cache записывает кэш и при падении, из-за чего
      # недособранное состояние переносится в следующие прогоны.
      - name: Кэш Android SDK/NDK (восстановление)
        id: cache-global
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-global-v3-${{ runner.os }}-

      - name: Кэш сборки p4a (восстановление)
        id: cache-local
        uses: actions/cache/restore@v4
        with:
          path: .buildozer
          key: buildozer-local-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-local-v3-${{ runner.os }}-

      # p4a создаёт временный venv командой `hostpython -m venv venv` поверх
      # уже существующего каталога, а пропатченный ensurepip не видит
      # обновлённый pip и пишет поверх него свою версию — получается смесь,
      # ломающая pip. Основной источник такого venv (вторая архитектура)
      # устранён в buildozer.spec, здесь же страхуемся от venv, пришедшего
      # из кэша прошлого прогона. Каталог одноразовый, создаётся за секунды.
      - name: Удалить venv из кэша
        run: |
          rm -rf .buildozer/android/platform/build-*/build/venv
          echo "временные venv удалены"

      # Полный лог пишем в файл: настоящая ошибка p4a печатается
      # задолго до финального «Command failed», и в веб-интерфейсе
      # Actions её легко пропустить.
      # Версию build-tools buildozer выбирать не даёт — он берёт самую свежую
      # (37.0.0) и проверяет утилиту aidl, которой там уже нет. Поэтому SDK
      # собираем сами с build-tools 33.0.2, где aidl на месте, а в spec стоит
      # android.skip_update = True, чтобы buildozer не обновил его до 37.
      - name: Подготовка Android SDK с фиксированными build-tools
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          if [ ! -x "$SDK/build-tools/33.0.2/aidl" ]; then
            mkdir -p "$SDK"
            cd "$HOME"
            wget -q -O cmdline.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip
            unzip -q -o cmdline.zip -d "$SDK"
            rm -f cmdline.zip
            yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
            "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" \
              "platform-tools" "build-tools;33.0.2" "platforms;android-34" > /dev/null
          fi
          echo "Установленные build-tools:"
          ls "$SDK/build-tools"
          test -x "$SDK/build-tools/33.0.2/aidl" \
            && echo "aidl на месте — проверка buildozer пройдёт" \
            || { echo "aidl отсутствует"; exit 1; }

      - name: Сборка debug APK
        id: build
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Показать место ошибки
        if: failure()
        run: |
          echo "=================== СТРОКИ С ОШИБКАМИ ==================="
          grep -nE "^\[ERROR\]|Traceback|error:|Error:|fatal error|No such file|md5|sha256|checksum" \
            build.log | tail -n 60 || true
          echo "=============== 200 СТРОК ПЕРЕД ПАДЕНИЕМ ================"
          grep -n "Command failed" build.log | head -n1 | cut -d: -f1 \
            | xargs -I{} sh -c 'start=$(( {} > 200 ? {} - 200 : 1 )); sed -n "${start},{}p" build.log'

      - name: Полный лог сборки
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30
          if-no-files-found: ignore

      - name: Кэш Android SDK/NDK (сохранение)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Кэш сборки p4a (сохранение)
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .buildozer
          key: buildozer-local-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      # Сведения об APK: помогают понять, почему он не ставится на телефон
      - name: Сведения об APK
        run: |
          set -e
          APK=$(ls bin/*.apk | head -n1)
          echo "Файл:   $APK"
          echo "Размер: $(du -h "$APK" | cut -f1)"
          AAPT="$HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2/aapt"
          if [ -x "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | grep -E \
              "^package|sdkVersion|targetSdkVersion|native-code|application-label" || true
          fi
          echo "Подпись:"
          unzip -l "$APK" | grep -E "META-INF/.*\.(RSA|DSA|EC)" \
            && echo "  APK подписан debug-ключом" \
            || echo "  ВНИМАНИЕ: подпись не найдена, установка невозможна"

      - name: Публикация APK
        uses: actions/upload-artifact@v4
        with:
          name: laseroptics-debug-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Приложить APK к релизу
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
